name: Runner switch

# This repo is public on purpose: public repos get unlimited standard
# GitHub-hosted minutes, so the switch itself keeps running when the accounts
# it manages are out of minutes. No pull_request triggers - secrets stay on
# the default branch.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "auto, or force a mode until the next month rollover"
        type: choice
        options: [auto, hosted, self-hosted]
        default: auto
      owner:
        description: "Only this owner (blank = all)"
        type: string
        default: ""

concurrency:
  group: runner-switch
  cancel-in-progress: false

permissions: {}

jobs:
  switch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned to a commit: a moved tag must not be able to read the secrets.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # Short-lived (1h) installation tokens from the runner-switch GitHub App,
      # scoped to the app's permissions. Until the app exists (vars.APP_CLIENT_ID
      # unset) these are skipped and the stored NM_TOKEN/GEEP_TOKEN are used.
      - id: nm
        if: vars.APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: NicholasMorris
      - id: geep
        if: vars.APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: geep-health
      - run: python3 switch.py
        env:
          NM_TOKEN: ${{ steps.nm.outputs.token || secrets.NM_TOKEN }}
          GEEP_TOKEN: ${{ steps.geep.outputs.token || secrets.GEEP_TOKEN }}
          FORCE_MODE: ${{ inputs.mode || 'auto' }}
          ONLY_OWNER: ${{ inputs.owner }}
